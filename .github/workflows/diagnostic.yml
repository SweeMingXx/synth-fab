name: Browser startup diagnostics
on:
  push:
    paths: ['tests/diagnose.mjs', '.github/workflows/diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - run: node tests/diagnose.mjs
